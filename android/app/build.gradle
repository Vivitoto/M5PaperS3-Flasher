plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.chaquo.python"
    id "dev.flutter.flutter-gradle-plugin"
}

def appVersionName = "0.3.15"
def appVersionCode = 36

android {
    namespace "vink.flasher"
    compileSdk 35
    buildToolsVersion "34.0.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // Vink Flasher 统一包名；改包名后与旧版不是同一个 App。
        applicationId "vink.flasher"
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

    }

    signingConfigs {
        release {
            storeFile file("keystore/release.keystore")
            storeType "pkcs12"
            storePassword System.getenv("INK_FLASHER_STORE_PASSWORD") ?: "inkflasher"
            keyAlias System.getenv("INK_FLASHER_KEY_ALIAS") ?: "inkflasher"
            keyPassword System.getenv("INK_FLASHER_KEY_PASSWORD") ?: "inkflasher"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.11"
        buildPython System.getenv("VINK_BUILD_PYTHON") ?: "python3.11"
        pip {
            install "intelhex==2.3.0"
            install "pyserial==3.5"
        }
    }
}

flutter {
    source "../.."
}


dependencies {
    implementation "com.github.mik3y:usb-serial-for-android:3.10.0"
    implementation "androidx.core:core-ktx:1.13.1"
}
