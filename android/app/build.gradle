plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def appVersionName = "0.1.1"
def appVersionPackageSuffix = "v" + appVersionName
        .replaceAll(/[^A-Za-z0-9]+/, "_")
        .replaceAll(/^_+|_+$/, "")
        .toLowerCase()

android {
    namespace "ink.flasher"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // 每个版本使用独立 applicationId，便于历史 APK 并存安装。
        // 例如 0.1.0 => ink.flasher.v0_1_0；App 显示名仍是 Ink Flasher。
        applicationId "ink.flasher.${appVersionPackageSuffix}"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName appVersionName
    }

    signingConfigs {
        release {
            storeFile file("keystore/release.keystore")
            storePassword "inkflasher"
            keyAlias "inkflasher"
            keyPassword "inkflasher"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
