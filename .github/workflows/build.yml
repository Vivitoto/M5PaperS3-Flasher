name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fix Android local.properties
        run: |
          FLUTTER_SDK=$(which flutter | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          cat android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Generate debug signing key
        run: |
          mkdir -p android/app/keystore
          keytool -genkey -v -keystore android/app/keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure signing
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=keystore/debug.keystore
          EOF

      - name: Build signed APK
        run: flutter build apk --release

      - name: Release APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ink Flasher (latest)
          body: |
            自动构建的 Ink Flasher。
            - 下载固件列表
            - USB 串口烧录 ESP32
            - 支持 M5Stack 官方 / EDC Book / 自制固件
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}