plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def appVersionName = "0.1.3"
def appVersionCode = 4

android {
    namespace "ink.flasher"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // 固定 applicationId，后续版本覆盖安装；App 显示名仍是 Ink Flasher。
        applicationId "ink.flasher"
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            storeFile file("keystore/release.keystore")
            storeType "pkcs12"
            storePassword System.getenv("INK_FLASHER_STORE_PASSWORD") ?: "inkflasher"
            keyAlias System.getenv("INK_FLASHER_KEY_ALIAS") ?: "inkflasher"
            keyPassword System.getenv("INK_FLASHER_KEY_PASSWORD") ?: "inkflasher"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
