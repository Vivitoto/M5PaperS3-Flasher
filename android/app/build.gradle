plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def appVersionName = "0.2.12"
def appVersionCode = 19

android {
    namespace "vink.flasher"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // Vink Flasher 统一包名；改包名后与旧版不是同一个 App。
        applicationId "vink.flasher"
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            storeFile file("keystore/release.keystore")
            storeType "pkcs12"
            storePassword System.getenv("INK_FLASHER_STORE_PASSWORD") ?: "inkflasher"
            keyAlias System.getenv("INK_FLASHER_KEY_ALIAS") ?: "inkflasher"
            keyPassword System.getenv("INK_FLASHER_KEY_PASSWORD") ?: "inkflasher"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
