name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fix Android local.properties
        run: |
          FLUTTER_SDK=$(which flutter | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          cat android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Generate release signing key
        run: |
          mkdir -p android/app/keystore
          keytool -genkey -v -keystore android/app/keystore/release.keystore -storepass inkflasher -alias inkflasher -keypass inkflasher -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ink Flasher,O=Ink,C=US"

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p output
          VERSION=$(grep -E '^[[:space:]]*def appVersionName' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_SUFFIX=$(echo "$VERSION" | sed -E 's/[^A-Za-z0-9]+/_/g; s/^_+|_+$//g')
          cp build/app/outputs/flutter-apk/app-release.apk "output/ink-flasher-v${VERSION_SUFFIX}.apk"

      - name: Sign APK with apksigner
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)
          $BUILD_TOOLS/apksigner sign \
            --ks android/app/keystore/release.keystore \
            --ks-pass pass:inkflasher \
            --key-pass pass:inkflasher \
            --ks-key-alias inkflasher \
            output/ink-flasher-v*.apk

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)
          $BUILD_TOOLS/apksigner verify -v output/ink-flasher.apk

      - name: Release APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ink Flasher (latest)
          body: |
            Ink Flasher - M5PaperS3 固件刷写工具
            - 多源固件列表（M5Stack 社区 + 自制）
            - USB 串口一键烧录
          files: output/ink-flasher-v*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
