name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fix Android local.properties
        run: |
          FLUTTER_SDK=$(which flutter | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          cat android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Generate release signing key
        run: |
          mkdir -p android/app/keystore
          keytool -genkey -v -keystore android/app/keystore/release.keystore -storepass inkflasher -alias inkflasher -keypass inkflasher -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ink Flasher,O=Ink,C=US"

      - name: Build APK
        run: flutter build apk --release

      - name: Sign APK with apksigner
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS"
          $BUILD_TOOLS/apksigner sign \
            --ks android/app/keystore/release.keystore \
            --ks-pass pass:inkflasher \
            --key-pass pass:inkflasher \
            --ks-key-alias inkflasher \
            $APK

      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)
          $BUILD_TOOLS/apksigner verify -v $APK

      - name: Release APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ink Flasher (latest)
          body: |
            自动构建的 Ink Flasher。
            - 下载固件列表
            - USB 串口烧录 ESP32
            - 支持 M5Stack 官方 / EDC Book / 自制固件
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}