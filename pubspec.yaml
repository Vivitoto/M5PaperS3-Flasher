name: m5papers3_flasher
description: Vink-PaperS3 ESP32 firmware flasher for Android.
publish_to: 'none'
version: 0.1.5+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.1.0
  crypto: ^3.0.0
  flutter_libserialport: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ink_flasher_logo.png
